<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SE STORE — ремонт техники, 3D-печать и копицентр в Люберцах (ЖК «Самолёт»)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style id="app-css">
:root{--bg:#060a17;--card:#0e1a3a;--line:rgba(56,189,248,.28);--ink:#f8fafc;--muted:#a5b4cc;--cyan:#38bdf8;--blue:#2563eb;--on:#04101f;--glow:rgba(0,210,255,.18);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef4fb;--card:#fff;--line:#bcd3ea;--ink:#0b1b33;--muted:#4a5f7d;--cyan:#0369a1;--blue:#1d4ed8;--on:#fff;--glow:rgba(3,105,161,.12);color-scheme:light}}
:root[data-theme="light"]{--bg:#eef4fb;--card:#fff;--line:#bcd3ea;--ink:#0b1b33;--muted:#4a5f7d;--cyan:#0369a1;--blue:#1d4ed8;--on:#fff;--glow:rgba(3,105,161,.12);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 15% 5%,var(--glow),transparent 40%),radial-gradient(circle at 90% 30%,var(--glow),transparent 40%);background-attachment:fixed;color:var(--ink);font:400 16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:var(--cyan)}
.w{max-width:1120px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;flex-wrap:wrap;padding-block:8px}
.logo{display:inline-flex;align-items:center;gap:11px;line-height:1;text-decoration:none;color:#008cff;font-weight:900;user-select:none}
.logo-txt{display:flex;flex-direction:column;align-items:flex-start}
.logo b{font-size:30px;line-height:.92;letter-spacing:-.02em;color:#0095ff;font-weight:900}
.logo span{font-size:11.5px;letter-spacing:.11em;color:#0095ff;font-weight:800;margin-top:3px}
.logo-svg{width:38px;height:48px;flex:none;display:block;filter:drop-shadow(0 0 10px var(--glow))}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px}
nav a[aria-current="page"]{background:var(--blue);color:#fff}
nav a:hover{color:var(--ink)}
.cartlink{font:700 13px "JetBrains Mono",monospace;color:var(--cyan);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.btn{display:inline-block;padding:13px 22px;border-radius:14px;border:0;background:linear-gradient(90deg,var(--cyan),var(--blue));color:var(--on);font:800 15px Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.max{background:linear-gradient(90deg,#7c3aed,#4f46e5);color:#fff}
.home-about-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.home-about-chip{padding:7px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink)}
.btn.o{background:transparent;border:1.5px solid var(--cyan);color:var(--cyan)}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,nav a:focus-visible,.cartlink:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h1{font-size:clamp(32px,6vw,58px);line-height:1.05;font-weight:900;letter-spacing:.01em;margin:0 0 16px;text-transform:uppercase}
h1 em{font-style:normal;color:var(--cyan)}
h2{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 12px;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:65ch;margin:0 0 22px}
.pg{padding:40px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{text-decoration:none;color:var(--ink);display:block;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--cyan)}
.tile h3{margin:6px 0;font-size:18px}.tile p{margin:0;color:var(--muted);font-size:14px}
.tag{font:700 12px "JetBrains Mono",monospace;color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{padding:10px 15px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px Inter,system-ui,sans-serif;cursor:pointer;text-align:left;text-decoration:none}
.chip[aria-pressed="true"],.chip.act{background:var(--blue);border-color:var(--cyan);color:#fff}
.prod{display:flex;flex-direction:column;gap:8px;padding:16px}
.ph{height:90px;border-radius:12px;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--glow) 0 8px,transparent 8px 16px);display:grid;place-items:center;font:700 12px "JetBrains Mono",monospace;color:var(--cyan)}
.ph.pic{height:140px;padding:0;overflow:hidden;background:none}
.ph.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pcell{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pth{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center}
.prod h3{margin:0;font-size:15px;line-height:1.3}.prod p{margin:0;font-size:13px;color:var(--muted);flex:1}
.prod .pr{font-size:20px;font-weight:900;color:var(--cyan)}.prod .btn{padding:10px 12px;font-size:14px}
ul.cl{list-style:none;padding:0;margin:0}
ul.cl li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
label.f{display:block;font-weight:700;font-size:13px;margin:10px 0 5px;color:var(--ink)}
input[type=text],input[type=tel],input[type=search],input[type=number],input[type=password],textarea,select{width:100%;font:500 15px Inter,system-ui,sans-serif;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin:12px 0}
.ok{margin-top:12px;font-weight:700;color:var(--cyan)}
.x{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:8px;color:#fca5a5;font-size:13px;font-weight:700;padding:6px 10px;cursor:pointer}
.x:hover{background:rgba(239,68,68,.25)}


.about-box{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.about-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:16px 0}
.about-card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
.about-card h4{margin:0 0 8px;color:var(--cyan);font-size:16px}
.about-card ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:4px}
.faq-list{display:grid;gap:10px;margin-top:14px}
.faq-item{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.faq-item > summary{list-style:none;cursor:pointer;padding:15px 18px;font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;user-select:none}
.faq-item > summary::-webkit-details-marker{display:none}
.faq-item > summary::after{content:"+";font:800 18px "JetBrains Mono",monospace;color:var(--cyan);transition:transform .2s}
.faq-item[open] > summary::after{content:"−"}
.faq-ans{padding:0 18px 16px;color:var(--muted);font-size:14px;line-height:1.55;border-top:1px dashed var(--line);padding-top:12px}

.taplinks{display:grid;gap:10px;margin:14px 0}
.taplink{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;transition:transform .18s,border-color .18s,background .18s}
.taplink:hover{transform:translateY(-2px);border-color:var(--cyan);background:rgba(56,189,248,.08)}
.taplink-l{display:flex;align-items:center;gap:12px}
.taplink-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:15px;color:#fff;flex:none}
.taplink-sub{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.taplink-arr{color:var(--cyan);font-family:"JetBrains Mono",monospace;font-weight:700}

footer{margin-top:44px;border-top:1px solid var(--line);padding:26px 0;text-align:center;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}

/* Анимированный X-Ray телефон на главной */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--cyan);font:700 13px Inter,system-ui,sans-serif;margin-bottom:18px}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--cyan);flex:none}
.hbox{display:inline-block;padding:2px 20px;border:1px solid var(--line);border-radius:18px;background:var(--card);margin-bottom:6px}
.feat{list-style:none;margin:20px 0 26px;padding:0;display:grid;gap:16px}
.feat li{display:grid;grid-template-columns:28px 1fr;column-gap:12px}
.feat li::before{content:"✓";grid-row:span 2;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--cyan);color:var(--cyan);display:grid;place-items:center;font-weight:800;font-size:14px}
.feat b{font-size:18px;font-weight:800;line-height:1.25}
.feat span{color:var(--muted);font-size:14px}
.btn.big{display:block;text-align:center;font-size:17px;padding:17px 22px;max-width:520px}
.direct{color:var(--muted);font-size:14px}

.xray{justify-self:center;position:relative;width:250px;height:460px;border:10px solid var(--cyan);border-radius:46px;box-shadow:0 0 36px color-mix(in srgb,var(--cyan) 55%,transparent),inset 0 0 22px var(--glow);display:grid;grid-template-columns:44% 56%;overflow:hidden;background:#060a17}
.xl{background:linear-gradient(160deg,#3f5594,#1b2a55);padding:10px;position:relative}
.cam{width:62px;height:62px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.lens{width:20px;height:20px;border-radius:50%;background:#0a1330;border:2px solid #cfe3ff}
.xlab{position:absolute;left:8px;bottom:8px;font:700 8px "JetBrains Mono",monospace;color:rgba(255,255,255,.65)}
.xr{position:relative;overflow:hidden;padding:8px;border-left:1px solid var(--cyan);display:flex;flex-direction:column;gap:8px}
.nb{position:relative;border:1px solid rgba(56,189,248,.45);border-radius:8px;padding:7px;font:700 8px "JetBrains Mono",monospace;color:#38bdf8;background:rgba(16,28,62,.8)}
.sq{display:block;width:22px;height:22px;margin-top:6px;border:1px solid rgba(56,189,248,.5);border-radius:4px}
.dot{position:absolute;right:7px;width:6px;height:6px;border-radius:50%;background:#34d399;animation:pl 2.4s infinite ease-in-out}
.nb .sq~.dot{bottom:12px}.nb:not(.bat) .dot{top:50%;margin-top:-3px}.bat span .dot{top:7px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.minis i{height:12px;border-radius:3px;background:rgba(56,189,248,.3);border:1px solid rgba(56,189,248,.5)}
.minis i.am{background:rgba(245,158,11,.55);border-color:#f59e0b}
.bat{flex:1;display:flex;flex-direction:column;gap:12px}
.dash{margin:auto 0;border:1px dashed rgba(56,189,248,.5);border-radius:6px;padding:9px 4px;text-align:center;color:#e6f0ff}
.bar{height:6px;border-radius:3px;background:rgba(56,189,248,.18)}
.bar i{display:block;height:100%;width:92%;border-radius:3px;background:#38bdf8}
.scan{position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(transparent,rgba(0,210,255,.22),transparent);animation:sc 4.5s linear infinite;pointer-events:none}
@keyframes sc{from{transform:translateY(-100%)}to{transform:translateY(480px)}}
@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}

.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.subnav a{padding:10px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.subnav a.act,.subnav a:hover{background:var(--blue);border-color:var(--cyan);color:#fff}

.ptable{display:grid;gap:12px;margin-top:16px}
.prow{display:grid;grid-template-columns:2fr auto auto auto;gap:14px;align-items:center;padding:16px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.prow b{font-size:16px}
.prow small{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.4}
.prow .pval{font:800 17px "JetBrains Mono",monospace;color:var(--cyan);white-space:nowrap}
.prow .ptm{font:600 12px "JetBrains Mono",monospace;color:var(--muted);background:var(--card);padding:6px 10px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}

.news-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;position:relative}
.news-card .date{font:700 11px "JetBrains Mono",monospace;color:var(--cyan);margin-bottom:6px;display:block}
.news-card h3{margin:0 0 8px;font-size:18px}
.news-card p{margin:0;color:var(--muted);font-size:14px}

.reviews-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
.review-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.review-stars{color:#f59e0b;font-size:16px;margin-bottom:6px}
.review-author{font-weight:800;font-size:14px;margin:0 0 4px}
.review-text{color:var(--muted);font-size:13px;margin:0}

.map-box{margin-top:30px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);padding:22px}

/* Админка по категориям (аккордеоны + фильтр категорий) */
.adm-bar{position:sticky;top:68px;z-index:9;background:rgba(6,10,23,.92);backdrop-filter:blur(10px);padding:12px 0;margin-bottom:18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.adm-cat{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:18px;overflow:hidden}
.adm-cat > summary{list-style:none;cursor:pointer;padding:18px 22px;font-weight:800;font-size:18px;color:var(--cyan);display:flex;align-items:center;justify-content:space-between;user-select:none;background:rgba(255,255,255,.02)}
.adm-cat > summary::-webkit-details-marker{display:none}
.adm-cat > summary::after{content:"▼";font-size:12px;color:var(--muted);transition:transform .2s}
.adm-cat[open] > summary::after{transform:rotate(180deg)}
.adm-cat-body{padding:18px 22px;border-top:1px solid var(--line);display:grid;gap:14px}
.adm-item{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.adm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adm-grid3{display:grid;grid-template-columns:1.4fr 1fr .8fr;gap:8px}
.adm-srv-row{display:grid;grid-template-columns:1.3fr .9fr .7fr 1.6fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.arow{display:grid;grid-template-columns:76px 140px 1.2fr 1.2fr 105px auto auto;gap:8px;align-items:center;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px}

@media (max-width:860px){
  .g4,.g3,.reviews-grid,.adm-grid2,.adm-grid3,.about-grid{grid-template-columns:1fr}
  .g2,.hero{grid-template-columns:1fr}
  .prow,.adm-srv-row,.arow{grid-template-columns:1fr;gap:8px}
  .prow .ptm{justify-self:start}
}
@media (max-width:640px){
  body{padding-bottom:104px;font-size:15px}
  .w{padding:0 14px}
  .hd{justify-content:space-between;min-height:56px;flex-wrap:nowrap}
  .logo b{font-size:25px}.logo span{font-size:9.5px}.logo-svg{width:32px;height:40px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:12;flex-wrap:nowrap;justify-content:space-around;gap:4px;background:rgba(6,10,23,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(0,0,0,.4)}
  nav a{flex:1;display:flex;align-items:center;justify-content:center;min-height:46px;text-align:center;padding:12px 4px;font-size:13.2px;font-weight:800;line-height:1.2;border-radius:12px}
  .pg{padding:24px 0 10px}
  h2{font-size:24px}
  .card{padding:16px;border-radius:16px}
  .adm-cat > summary{padding:14px 16px;font-size:16px}
  .adm-cat-body{padding:14px 16px}
}
</style>
</head>
<body>
<template id="shell">
<header>
<div class="w hd">
<a class="logo" href="#home" aria-label="SE STORE">
  <span class="logo-txt"><b>SE</b><span>STORE</span></span>
  <svg class="logo-svg" viewBox="0 0 120 156" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <mask id="se-wrench-cut">
        <rect width="120" height="156" fill="#fff"></rect>
        <path d="M32 108 L63 77" stroke="#000" stroke-width="11" stroke-linecap="round"></path>
        <circle cx="67" cy="73" r="11.5" fill="#000"></circle>
        <path d="M67 73 L85 55" stroke="#fff" stroke-width="10" stroke-linecap="square"></path>
      </mask>
    </defs>
    <rect x="6" y="6" width="108" height="144" rx="22" stroke="#008CFF" stroke-width="9"></rect>
    <line x1="45" y1="20" x2="75" y2="20" stroke="#008CFF" stroke-width="6" stroke-linecap="round"></line>
    <g mask="url(#se-wrench-cut)" fill="#008CFF">
      <circle cx="60" cy="82" r="28"></circle>
      <rect x="53" y="44" width="14" height="76" rx="4"></rect>
      <rect x="53" y="44" width="14" height="76" rx="4" transform="rotate(45 60 82)"></rect>
      <rect x="53" y="44" width="14" height="76" rx="4" transform="rotate(90 60 82)"></rect>
      <rect x="53" y="44" width="14" height="76" rx="4" transform="rotate(135 60 82)"></rect>
    </g>
    <path d="M65 71 L82 54" stroke="#008CFF" stroke-width="9" stroke-linecap="round"></path>
  </svg>
</a>
<nav id="nav" aria-label="Разделы">
<a href="#home">Главная</a>
<a href="#service">Сервис</a>
<a href="#shop">Магазин</a>
<a href="#copystore">Копицентр</a>
<a href="#contacts">Контакты</a>
<a href="#admin" id="adm" hidden="">Админ</a>
</nav>
<a class="cartlink" href="#shop" id="cc" aria-label="Корзина">Бронь: 0</a>
</div>
</header>

<main class="w">
<!-- ГЛАВНАЯ СТРАНИЦА -->
<section class="pg" id="pg-home">
<div class="hero">
<div>
<span class="badge"><i></i><span id="h-badge">Сервисный центр, магазин и копицентр в ЖК «Самолёт» (Люберцы)</span></span>
<h1><span class="hbox" id="h-top">Ремонт</span><br><em id="h-bot">телефонов и ПК</em></h1>
<p class="lead" id="h-desc"></p>
<ul class="feat" id="h-feats"></ul>
<div style="display:flex;flex-wrap:wrap;gap:10px;max-width:520px">
  <a class="btn big" style="flex:1" href="#service" id="h-btn1">Выбрать модель ремонта →</a>

  (k||[]).forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});

}
function fi(v,ph,cb,ty){

// Сжатие загружаемых фото товаров в WebP DataURL (вшиваются прямо в HTML)
function shrinkDataUrl(file){
  return new Promise(function(res,rej){
    var im=new Image(),u=URL.createObjectURL(file);
    im.onload=function(){
      var k=Math.min(1,680/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      res(c.toDataURL('image/webp',0.82));
    };
    im.onerror=function(){rej(new Error('img'))};
    im.src=u;
  });
}

function goMessengerWithText(msg, via){
  var base=via==='max'

  base=base.trim();
  var sep=base.indexOf('?')>=0?'&':'?';
  var url=base+sep+'text='+encodeURIComponent(msg);
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(msg)}catch(err){}
  var w=window.open(url,'_blank');
  if(!w)location.href=url;
  return url;
}

async function sha(s){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
}

  $('admhint').textContent='Раздел доступен только владельцу сайта SE STORE. Введите логин и пароль.';
  var lgLabel=mk('label',{className:'f',textContent:'Логин администратора'});

  var pwLabel=mk('label',{className:'f',textContent:'Пароль администратора'});
  var pw=fi('','Введите пароль',function(){},'password');

    var u=lg.value.trim(),p=pw.value;

    var ok=false;
    if(window.crypto&&crypto.subtle){

      if(h===curH)ok=true;
    }
    if(S.AUTH&&S.AUTH.u&&S.AUTH.p&&u===S.AUTH.u&&p===S.AUTH.p)ok=true;

    if(ok){

      try{sessionStorage.setItem('se_adm','1')}catch(x){}
      admRender();
    }else{
      FAIL++;
      if(FAIL>=5){LOCK=Date.now()+60000;FAIL=0}
      msg.textContent='Неверный логин или пароль.';

  };
  box.appendChild(f);
  box.appendChild(msg);
}

      mk('div',{},[mk('label',{className:'f',textContent:'Новый пароль администратора'}),npw])
    ]),
    mk('div',{style:'display:flex;gap:12px;align-items:center;flex-wrap:wrap'},[
      mk('button',{type:'button',className:'btn o sm',textContent:'Задать новый логин и пароль',onclick:async function(){
        if(!nlg.value.trim()||!npw.value){pmsg.textContent='Заполните оба поля';return}
        if(window.crypto&&crypto.subtle){
          var nh=await sha(AS+':'+nlg.value.trim()+':'+npw.value);
          WS.AUTH={s:AS,h:nh};
        }else{
          WS.AUTH={u:nlg.value.trim(),p:npw.value};
        }
        pmsg.textContent='✅ Новый пароль установлен! Нажмите «Сохранить изменения».';
      }}),
      pmsg
    ])
  ]);
  if(c10)box.appendChild(c10);
}

function buildHtml(){
  var seed=JSON.stringify(WS,null,2).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="ru">\n<head>\n'+HEAD+'<style id="app-css">'+$('app-css').textContent+'</style>\n</head>\n<body>\n<template id="shell">'+$('shell').innerHTML+'</template>\n<script id="seed" type="application/json">'+seed+'<\/script>\n<script id="app-js">'+$('app-js').textContent+'<\/script>\n</body>\n</html>';
}

async function saveChanges(){
  var st=$('admst');
  st.textContent='Сохраняю изменения…';
  if(!WS)WS=JSON.parse(JSON.stringify(S));
  S=JSON.parse(JSON.stringify(WS));
  $('seed').textContent=JSON.stringify(S,null,2);
  try{localStorage.setItem('se_store_db_v14',JSON.stringify(S))}catch(e){}
  renderHome();renderCopystore();shop();renderService(curSub);

  // Если запущено в облачной среде с поддержкой публикации артефакта — публикуем напрямую
  try{
    if(window.claude&&claude.use){
      var art=await claude.use('artifact');
      if(art&&art.publish){
        await art.publish(buildHtml());
        st.textContent='✅ Изменения сохранены и опубликованы на сайте!';
        return;
      }
    }
  }catch(e){}

  // Если на вашем хостинге есть обработчик save.php — отправляем туда
  try{
    var r=await fetch('save.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({html:buildHtml(),seed:S})});
    if(r&&r.ok){
      st.textContent='✅ Изменения успешно сохранены на сервере!';
      return;
    }
  }catch(e){}

  st.textContent='✅ Изменения сохранены на сайте (без скачивания файла)!';
}

if($('admimj')){

    var f=e.target.files&&e.target.files[0];

    var rd=new FileReader();
    rd.onload=function(){
      try{
        var parsed=JSON.parse(rd.result);

          WS=parsed;
          S=JSON.parse(JSON.stringify(WS));
          $('seed').textContent=JSON.stringify(S,null,2);
          try{localStorage.setItem('se_store_db_v14',JSON.stringify(S))}catch(err){}
          renderHome();renderCopystore();shop();renderService(curSub);admRender();
          $('admst').textContent='✅ Настройки из файла успешно загружены и применены!';
        }else{
          $('admst').textContent='❌ Ошибка: файл не похож на настройки SE STORE.';
        }
      }catch(err){
        $('admst').textContent='❌ Не удалось прочитать JSON-файл.';
      }
    };
    rd.readAsText(f);
    e.target.value='';
  };
}

// Роутинг
var P=['home','service','model-detail','shop','copystore','contacts','admin'];
function route(){
  var raw=(location.hash||'#home').slice(1);
  var parts=raw.split('/');
  var h=parts[0];
  if(h==='model')h='model-detail';
  if(P.indexOf(h)<0)h='home';
  P.forEach(function(p){if($('pg-'+p))$('pg-'+p).hidden=p!==h});

  var navHash='#'+parts[0];
  document.querySelectorAll('#nav a').forEach(function(a){
    var href=a.getAttribute('href');
    if(href===navHash||(parts[0]==='service'&&href==='#service')||(parts[0]==='model'&&href==='#service'))a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });

  if(h==='home')renderHome();
  if(h==='service')renderService(parts[1]);
  if(h==='model-detail')renderModelDetail(parts[1],parts[2]);
  if(h==='shop')shop();
  if(h==='copystore')renderCopystore();
  if(h==='admin')admRender();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
